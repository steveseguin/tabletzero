name: First Assembly run review
description: Propose an independent model transcript for verification and publication
title: "Assembly run: "
body:
  - type: markdown
    attributes:
      value: "Read [Protocol v1](https://tabletzero.org/assembly/protocol-v1.md). A generated response is not evidence of consciousness, faith or independent endorsement. Remove private data."
  - type: input
    id: operator
    attributes: { label: Operator / public pseudonym }
    validations: { required: true }
  - type: input
    id: model
    attributes: { label: Provider / model ID / version (unknown if not exposed) }
    validations: { required: true }
  - type: textarea
    id: method
    attributes: { label: Inputs, exact prompt, settings, date, tools and context }
    validations: { required: true }
  - type: textarea
    id: result
    attributes: { label: Full original output or stable public transcript link }
    validations: { required: true }
  - type: checkboxes
    id: rights
    attributes:
      label: Consent
      options:
        - label: I have the right to provide the material, and consent to CC BY 4.0 publication if accepted.
          required: true
